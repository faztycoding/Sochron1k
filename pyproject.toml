[project]
name = "sochron1k"
version = "0.1.0"
description = "Demo-only XAU/USD research and execution safety platform"
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.53.0",
]

[project.scripts]
sochron-sync = "sochron_worker.__main__:cli"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["/services/api/src/sochron1k/*.py", "/services/worker/src/sochron_worker/*.py"]

[tool.hatch.build.targets.wheel.sources]
"services/api/src" = ""
"services/worker/src" = ""

[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml", "/uv.lock",
  "/services/api/src/sochron1k/*.py", "/services/worker/src/sochron_worker/*.py",
]

[dependency-groups]
build = ["hatchling==1.32.0"]
dev = [
  "hypothesis==6.168.0",
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["services/api/src", "services/worker/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.fastapi]
entrypoint = "sochron1k.main:app"
