[project]
name = "sochron1k"
version = "0.1.0"
description = "Demo-only XAU/USD research and execution safety platform"
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.53.0",
]

[dependency-groups]
dev = [
  "hypothesis==6.168.0",
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["services/api/src", "services/worker/src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.fastapi]
entrypoint = "sochron1k.main:app"
